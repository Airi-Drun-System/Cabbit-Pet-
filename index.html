  :root{--gold:#ffd34d;--cream:#fdf6e8;--ink:#2b2238;--panel:rgba(30,14,58,.92);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#1a0b33;color:var(--cream);font-family:"BIPs","Baloo 2","Segoe UI Rounded","Trebuchet MS",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;}
  #stage{position:relative;flex:1;width:100%;max-width:520px;}
  canvas#room{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none;z-index:3;}
  .pill{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;background:rgba(24,10,48,.62);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12),0 6px 18px rgba(0,0,0,.25);font-size:16px;}
  .lvl{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#ffe38a,#ff9f45);color:#3a1a00;font-size:15px;box-shadow:0 3px 0 #b8660e;}
  .coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c0,#ffd34d 45%,#e09a10);box-shadow:inset 0 0 0 2px #b8780e;}
  .needs{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;justify-content:center;gap:6px;z-index:3;pointer-events:none;}
  .need{pointer-events:auto;cursor:pointer;width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;opacity:.95;}

function applyTime(now){
  let h = (now - pet.t) / 3600000;
  if (!(h > 0)) { pet.t = now; return 0; }
  h = Math.min(h, 96);
  const away = h > 0.25;
  let left = h, done = 0;
  while (left > 0){
    const st = Math.min(0.25, left);
    const k = away && done >= 2 ? 0.5 : 1;
    const r = pet.sleep ? RATES.sleep : RATES.awake;
    for (const n in r){
      const floor = away && r[n] > 0 ? 12 : 0;
      const v = pet[n] - r[n] * st * (r[n] > 0 ? k : 1);
      pet[n] = clamp(r[n] > 0 && pet[n] >= floor ? Math.max(floor, v) : v, 0, 100);
    }
    if (away && !pet.sleep && pet.energy <= 15){ pet.sleep = true; napped = true; }
    if (away && pet.sleep && pet.energy >= 100){ pet.sleep = false; }
    left -= st; done += st;
  }
  pet.t = now;
  return h;
}

function audio(){
  if (!soundOn) return;
  if (actx){ if (actx.state === 'suspended' && actx.resume) actx.resume().catch(() => {}); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  try {
    const comp = actx.createDynamicsCompressor(); comp.connect(actx.destination);
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000; lp.connect(comp);
    dry = actx.createGain(); dry.gain.value = 0.9; dry.connect(lp);
    const conv = actx.createConvolver();
    const len = Math.floor(actx.sampleRate * 1.1), buf = actx.createBuffer(2, len, actx.sampleRate);
    for (let c = 0; c < 2; c++){ const d = buf.getChannelData(c); let l = 0; for (let i = 0; i < len; i++){ l += (Math.random() * 2 - 1 - l) * 0.4; d[i] = l * Math.pow(1 - i / len, 2.6); } }
    conv.buffer = buf;
    wet = actx.createGain(); wet.gain.value = 0.25; wet.connect(conv); conv.connect(lp);
    const nl = Math.floor(actx.sampleRate * 1.5); noiseBuf = actx.createBuffer(1, nl, actx.sampleRate);
    const nd = noiseBuf.getChannelData(0); let b = 0; for (let i = 0; i < nl; i++){ b = 0.97 * b + (Math.random() * 2 - 1) * 0.15; nd[i] = b; }
  } catch (e) {}
}
function tone(f, f2, dur, vol, delay, verb){
  if (!soundOn || !actx || !dry) return;
  try {
    const t0 = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur * 0.8);
    const gn = actx.createGain();
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(dry);
    if (wet){ const s = actx.createGain(); s.gain.value = verb == null ? 0.4 : verb; gn.connect(s); s.connect(wet); }
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function noise(f0, f1, dur, vol, delay){
  if (!soundOn || !actx || !noiseBuf) return;
  try {
    const t0 = actx.currentTime + (delay || 0);
    const s = actx.createBufferSource(); s.buffer = noiseBuf;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1;
    bp.frequency.setValueAtTime(f0, t0); bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);

    s.connect(bp); bp.connect(gn); gn.connect(dry);

  } catch (e) {}
}

function skyColors(){

  if (h >= 7 && h < 17) return { a: '#8fd0ff', b: '#d8f0ff', sun: 1, night: 0, beam: 'rgba(255,245,200,' };
  if (h >= 17 && h < 20) return { a: '#ff9a7a', b: '#ffd8a0', sun: 0.6, night: 0.2, beam: 'rgba(255,190,130,' };

    const pr = document.createElement('small'); pr.textContent = locked ? 'с ' + f.lv + ' уровня' : (f.p ? f.p + ' монет' : 'бесплатно');

const mgc = document.getElementById('mgc');
const mq = mgc.getContext('2d');
let MG = null, MS = 1, MH = 700, MDPR = 1;
function mgResize(){
  const r = mgc.getBoundingClientRect();
  if (!(r.width > 20 && r.height > 20)) return;
  MDPR = Math.min(2, window.devicePixelRatio || 1);
  mgc.width = Math.round(r.width * MDPR); mgc.height = Math.round(r.height * MDPR);
  MS = r.width / 400; MH = r.height / MS;
}
window.addEventListener('resize', () => { if (MG) mgResize(); });
function mgStart(id){
  if (pet.sleep){ toast(pet.name + ' спит'); return; }
  if (pet.energy < 12){ sfx.no(); toast(pet.name + ' устал. Сначала пусть поспит'); return; }
  closeSheets(); resetModes();
  document.getElementById('mg').hidden = false;
  document.getElementById('mgEnd').hidden = true;
  mgResize();
  MG = { id, t: 0, cd: 2.4, score: 0, over: false, parts: [], shake: 0, flash: 0, ptr: { down: false, x: 200, y: 0 } };
  MGAMES[id].init(MG);

}
function mgHud(){ document.getElementById('mgScore').textContent = String(MG ? Math.floor(MG.score) : 0); }
function mgExit(){ MG = null; document.getElementById('mg').hidden = true; refreshHud(); }
function mgOver(){
  if (!MG || MG.over) return;
  MG.over = true;
  const id = MG.id, score = Math.floor(MG.score);
  const best = pet.mgBest[id] || 0;
  const rec = score > best;
  if (rec) pet.mgBest[id] = score;
  if (!pet.mgEarn || pet.mgEarn.d !== todayKey()) pet.mgEarn = { d: todayKey(), n: 0 };
  const coins = Math.max(0, Math.min(mgReward(id, score), MG_DAY_CAP - pet.mgEarn.n));
  pet.mgEarn.n += coins; pet.coins += coins;
  pet.fun = clamp(pet.fun + 14, 0, 100); pet.energy = clamp(pet.energy - 7, 0, 100); pet.hunger = clamp(pet.hunger - 4, 0, 100);
  pet.stats.games = (pet.stats.games || 0) + 1;
  const xp = 3 + Math.min(12, Math.floor(mgReward(id, score) / 3));
  save();
  document.getElementById('mgeT').textContent = rec && score > 0 ? 'Новый рекорд!' : 'Игра окончена';
  document.getElementById('mgeS').textContent = String(score);
  document.getElementById('mgeP').textContent = 'Рекорд: ' + Math.max(best, score) + '. Монеты: +' + coins + '. Опыт: +' + xp + (coins === 0 && mgReward(id, score) > 0 ? '. Лимит монет на сегодня исчерпан' : '');
  setTimeout(() => {
    if (!MG) return;
    document.getElementById('mgEnd').hidden = false;
    if (rec && score > 0) sfx.lvl(); else sfx.done();
    if (coins) sfx.coin();
    addXp(xp);
  }, 500);
}

function mgFrame(dt){
  const G = MG;
  if (!mgc.width) mgResize();
  G.t += dt;
  if (G.cd > 0){ const c0 = Math.ceil(G.cd); G.cd -= dt; const c1 = Math.ceil(G.cd); if (c1 !== c0) (c1 > 0 ? sfx.tap() : sfx.catch(3)); }
  else if (!G.over) MGAMES[G.id].update(G, dt);
  G.shake = Math.max(0, G.shake - dt * 3); G.flash = Math.max(0, G.flash - dt * 2.5);
  for (let i = G.parts.length - 1; i >= 0; i--){ const p = G.parts[i]; p.life -= dt * (p.d || 1); if (p.life <= 0){ G.parts.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; if (p.g) p.vy += p.g * dt; }
  const q = mq;
  q.setTransform(MS * MDPR, 0, 0, MS * MDPR, 0, 0);
  q.save();
  if (G.shake > 0) q.translate(rand(-6, 6) * G.shake, rand(-6, 6) * G.shake);
  MGAMES[G.id].draw(G, q);
  for (const p of G.parts){
    q.save(); q.globalAlpha = clamp(p.life, 0, 1);
    if (p.k === 'txt'){ q.fillStyle = p.c || '#fff'; q.strokeStyle = 'rgba(40,10,60,.7)'; q.lineWidth = 4; q.font = (p.s || 22) + 'px "BIPs",sans-serif'; q.textAlign = 'center'; q.strokeText(p.t, p.x, p.y); q.fillText(p.t, p.x, p.y); }
    else if (p.k === 'spark'){ q.fillStyle = p.c; q.translate(p.x, p.y); q.rotate(G.t * 4); star(q, 0, 0, p.r || 5); }
    else { q.fillStyle = p.c || '#fff'; dot(q, p.x, p.y, p.r || 3); }
    q.restore();
  }
  q.restore();
  if (G.flash > 0){ q.fillStyle = 'rgba(255,80,110,' + (G.flash * 0.35) + ')'; q.fillRect(0, 0, 400, MH); }
  if (G.cd > 0){
    const n = Math.ceil(G.cd), k = G.cd - Math.floor(G.cd);
    q.save(); q.fillStyle = 'rgba(20,8,40,.35)'; q.fillRect(0, 0, 400, MH);
    q.translate(200, MH * 0.42); q.scale(1 + k * 0.6, 1 + k * 0.6);
    q.fillStyle = '#ffd34d'; q.strokeStyle = 'rgba(40,10,60,.8)'; q.lineWidth = 8; q.font = '96px "BIPs",sans-serif'; q.textAlign = 'center'; q.textBaseline = 'middle';
    q.strokeText(String(n), 0, 0); q.fillText(String(n), 0, 0);
    q.restore();
    q.save(); q.fillStyle = '#fff'; q.font = '20px "BIPs",sans-serif'; q.textAlign = 'center'; q.fillText(MINIGAMES.find(m => m.id === G.id).d, 200, MH * 0.42 + 90); q.restore();
  }
  mgHud();
}

  for (const u of list.slice(0, 9)){
    const d = document.createElement('div'); d.className = 'unlItem';
    d.appendChild(u.c());
    const s = document.createElement('span'); s.textContent = u.n; d.appendChild(s);
    box.appendChild(d);
  }
}
let shopTab = 'wall';
function itemPreview(cat, it){
  const c = document.createElement('canvas'); c.width = 168; c.height = 128;
  const q = c.getContext('2d'); q.scale(2, 2);
  const keep = { floorY, W, H };
  const bgc = q.createLinearGradient(0, 0, 0, 64); bgc.addColorStop(0, '#3a2466'); bgc.addColorStop(1, '#241444'); q.fillStyle = bgc; q.fillRect(0, 0, 84, 64);
  q.save();
  if (cat === 'wall'){ floorY = 64; W = 84; drawWallPattern(q, it, 0, 0, 84, 64); }
  else if (cat === 'floor'){ floorY = 0; W = 84; H = 64; drawFloor(q, it); }
  else if (cat === 'tiles'){ drawTiles(q, it, 0, 0, 84, 64); }
  else if (cat === 'sofa'){ q.translate(42, 58); q.scale(0.4, 0.4); drawSofa(q, it.id, 0, 0); }
  else if (cat === 'night'){ q.translate(42, 62); q.scale(0.5, 0.5); drawNight(q, it.id, 0, 0, 0.8); }
  else if (cat === 'tub'){ q.translate(42, 24); q.scale(0.29, 0.29); drawTub(q, it.id, 0, 0, 'back', 0.8); drawTub(q, it.id, 0, 0, 'front', 0.8); }
  else if (cat === 'toy'){ if (it.id !== 'none'){ q.translate(42, 38); q.scale(1.3, 1.3); drawToy(q, it.id, 0, 0, 0); } }
  else if (cat === 'potty'){ q.translate(42, 44); q.scale(0.3, 0.3); drawPotty(q, it.id, 0, 0, 'back', 0); drawPotty(q, it.id, 0, 0, 'front', 0); }
  else if (it.id !== 'none'){
    const sc = { rug: 0.33, bed: 0.46, lamp: 0.34, plant: 0.62, poster: 0.44, window: 0.36 }[cat];
    q.translate(42, 34); q.scale(sc, sc);
    const off = { rug: [-180, -(keep.floorY + 160)], bed: [-300, -(keep.floorY + 36)], lamp: [-118, -(keep.floorY - 56)], plant: [-42, -(keep.floorY + 30)], poster: [-308, -(keep.floorY - 204)], window: [-94, -(keep.floorY - 194)] }[cat];
    q.translate(off[0], off[1]);
    if (cat === 'rug') drawRug(q, it.id);
    if (cat === 'bed') drawBed(q, it.id);
    if (cat === 'lamp') drawLamp(q, it.id, 0, 0.7);
    if (cat === 'plant') drawPlant(q, it.id, 0);
    if (cat === 'poster') drawPoster(q, it.id);
    if (cat === 'window') drawWindow(q, it.id, 0);
  }
  q.restore();
  floorY = keep.floorY; W = keep.W; H = keep.H;
  if (it.id === 'none'){ q.strokeStyle = 'rgba(255,255,255,.35)'; q.lineWidth = 3; q.beginPath(); q.arc(42, 32, 16, 0, 6.2832); q.moveTo(31, 43); q.lineTo(53, 21); q.stroke(); }
  return c;
}
function renderShop(){
  const defs = ROOM_TABS[pet.at];
  if (!defs.find(x => x[0] === shopTab)) shopTab = defs[0][0];
  document.getElementById('shopTitle').textContent = ROOMS.find(r => r.id === pet.at).n;
  const tabs = document.getElementById('shopTabs');
  tabs.innerHTML = '';
  for (const [k, n] of defs){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tab' + (k === shopTab ? ' on' : ''); b.textContent = n;
    b.addEventListener('click', () => { shopTab = k; sfx.tap(); renderShop(); });
    tabs.appendChild(b);
  }
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  const cat = catOf(shopTab);
  for (const it of ROOM[cat]){
    const key = cat + ':' + it.id;
    const own = pet.owned.indexOf(key) !== -1 || it.p === 0;
    const locked = !own && it.lv && pet.lvl < it.lv;
    const cur = pet.room[shopTab] === it.id;
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'item' + (cur ? ' cur' : '') + (!own && (locked || pet.coins < it.p) ? ' cant' : '');
    b.appendChild(itemPreview(cat, it));
    const n = document.createElement('span'); n.textContent = it.n; b.appendChild(n);
    const pr = document.createElement('span'); pr.className = 'pr';
    if (cur) pr.textContent = 'Стоит';
    else if (own) pr.textContent = 'Поставить';
    else if (locked){ pr.className = 'lock'; pr.textContent = 'с ' + it.lv + ' уровня'; }
    else { const cc = document.createElement('i'); cc.className = 'coin'; pr.appendChild(cc); pr.appendChild(document.createTextNode(String(it.p))); }
    b.appendChild(pr);
    b.addEventListener('click', () => {
      if (locked){ toast('Откроется на ' + it.lv + ' уровне'); return; }
      if (!own){
        if (!spendCoins(it.p)){ toast('Не хватает монет'); return; }
        pet.owned.push(key); sfx.buy(); toast('Куплено: ' + it.n); addXp(4);
        burst(200, floorY, 14, ['#ffd34d', '#fff3b0']);
      } else sfx.tap();
      pet.room[shopTab] = it.id;
      worldDirty = true; save(); renderShop();
    });
    grid.appendChild(b);
  }
}
document.getElementById('aRoom').addEventListener('click', () => { audio(); if (!busyAnim()) stopModes(); renderShop(); openSheet('shopSheet'); });
document.getElementById('aWard').addEventListener('click', () => { audio(); if (busyAnim()) return; renderWardrobe(); openSheet('shopSheet'); });
document.getElementById('aGames').addEventListener('click', () => { audio(); sitToPlay(); });

function renderStats(){
  const box = document.getElementById('stats');
  const days = Math.max(1, Math.floor((Date.now() - pet.born) / 86400000) + 1);
  box.innerHTML = '';
  const add = (lbl, val) => { const d = document.createElement('div'); d.className = 'stat'; const b = document.createElement('b'); b.textContent = val; d.appendChild(b); d.appendChild(document.createTextNode(lbl)); box.appendChild(d); };
  add('уровень', String(pet.lvl));
  add('дней вместе', String(days));
  add('накормлен', pet.stats.fed + ' раз');
  add('лучшая серия', String(pet.best));
  add('опыт', pet.xp + ' из ' + xpNeed());
  add('мини-игр сыграно', String(pet.stats.games || 0));
  const xb = document.createElement('div'); xb.className = 'xpbar'; const xi = document.createElement('i'); xi.style.width = Math.round(pet.xp / xpNeed() * 100) + '%'; xb.appendChild(xi); box.appendChild(xb);
  const nx = unlocksAt(pet.lvl + 1);
  if (nx.length){ const d = document.createElement('div'); d.className = 'stat'; d.style.gridColumn = '1/-1'; const b = document.createElement('b'); b.textContent = 'На ' + (pet.lvl + 1) + ' уровне'; d.appendChild(b); d.appendChild(document.createTextNode(nx.map(u => u.n).join(', '))); box.appendChild(d); }
}
document.getElementById('namePill').addEventListener('click', () => {
  audio();
  document.getElementById('nameIn').value = pet.name;
  document.getElementById('soundBtn').textContent = 'Звук: ' + (soundOn ? 'вкл' : 'выкл');
  renderStats();
  openSheet('nameSheet');
});
document.getElementById('nameSave').addEventListener('click', () => {
  const v = document.getElementById('nameIn').value.replace(/[<>"'`]/g, '').trim().slice(0, 14);
  if (v){ pet.name = v; save(); refreshHud(); toast('Теперь его зовут ' + v); }
  closeSheets();
});
document.getElementById('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn; LS.set('sound', soundOn ? '1' : '0');
  document.getElementById('soundBtn').textContent = 'Звук: ' + (soundOn ? 'вкл' : 'выкл');
  if (soundOn){ audio(); sfx.tap(); }
});

let modalCb = null;
function showModal(title, text, btn, cb, art, input){
  document.getElementById('mTitle').textContent = title;
  document.getElementById('mText').textContent = text;
  document.getElementById('mBtn').textContent = btn || 'Хорошо';
  const inp = document.getElementById('mInput');
  inp.hidden = !input;
  if (input) inp.value = '';
  showUnlocks([]);
  paintModalArt(art);
  document.getElementById('modal').hidden = false;
  modalCb = cb;
  if (input) setTimeout(() => inp.focus(), 250);
}
let modalArtKind = '';
function paintModalArt(art){
  modalArtKind = art;
  const c = document.getElementById('modalArt');
  const q = c.getContext('2d');
  q.setTransform(1, 0, 0, 1, 0, 0); q.clearRect(0, 0, 240, 200);
  const gl = q.createRadialGradient(120, 110, 10, 120, 110, 110); gl.addColorStop(0, 'rgba(255,211,77,.35)'); gl.addColorStop(1, 'rgba(255,211,77,0)');
  q.fillStyle = gl; q.fillRect(0, 0, 240, 200);
  if (art === 'gift'){ q.translate(120, 100); q.scale(3, 3); drawIcon(q, 'gift'); }
  else { q.translate(120, 190); q.scale(0.95, 0.95); if (heroReady){ q.drawImage(heroVariant(0), -BOX / 2, -BOX, BOX, BOX); } else drawVectorCabbit(q, { sleep: false, joy: art === 'lvl' ? 1 : 0, mood: 90, look: 0, chew: 0, dirt: 0, t: 0, blink: 0 }); }
}
document.getElementById('mBtn').addEventListener('click', () => {
  audio();
  const inp = document.getElementById('mInput');
  if (!inp.hidden){
    const v = inp.value.replace(/[<>"'`]/g, '').trim().slice(0, 14);
    if (!v){ inp.placeholder = 'Придумай имя'; return; }
    pet.name = v; save(); refreshHud();
  }
  document.getElementById('modal').hidden = true;
  const cb = modalCb; modalCb = null;
  sfx.tap();
  if (cb) cb();
});

function dailyGift(){
  const d = todayKey();
  if (pet.daily.d === d) return false;
  const y = new Date(Date.now() - 86400000);
  const yk = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate();
  const streak = pet.daily.d === yk ? Math.min(7, pet.daily.streak + 1) : 1;
  pet.daily = { d, streak };
  const gift = 20 + streak * 10;
  pet.coins += gift; save(); refreshHud();
  showModal('Подарок дня', 'День ' + streak + ' подряд: ' + gift + ' монет. Заходи каждый день, подарок растёт до 7 дня!', 'Забрать', () => { sfx.coin(); bumpCoins(); }, 'gift');
  return true;
}
function awayReport(){
  if (awayHours < 1) return false;
  const worst = NEEDS.map(n => n[0]).sort((a, b) => pet[a] - pet[b])[0];
  const words = { hunger: 'проголодался', clean: 'испачкался', fun: 'заскучал', energy: 'устал', toilet: 'очень хочет в туалет' };
  const h = Math.round(awayHours);
  const text = pet[worst] < 50 ? 'Тебя не было ' + h + ' ч. ' + pet.name + ' ' + words[worst] + ' и ждёт тебя.' : 'Тебя не было ' + h + ' ч. ' + pet.name + ' скучал, но держится молодцом!';
  toast(napped && pet.sleep ? 'Тебя не было ' + h + ' ч. ' + pet.name + ' устал и сам уснул. Не буди, пусть поспит.' : text);
  return true;
}
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ applyTime(Date.now()); refreshHud(); } else save(); });
window.addEventListener('pagehide', save);
for (const r of ROOMS) rebuildRoom(r.id);
applyGfx();
syncState();
buildBeam(pet.at);
refreshHud();
updateRoomUi();
function afterStart(){
  if (firstRun){
    showModal('Привет!', 'Это твой кэббит. У него четыре комнаты: гостиная, ванная, туалет и спальня. Листай их стрелками или свайпом, а по мебели можно тапать. Как его назовёшь?', 'Готово', () => {
      toast('Держи 150 монет на обустройство комнаты');
      pet.daily = { d: todayKey(), streak: 1 }; save(); roomTip();
    }, 'hello', true);
  } else { if (!dailyGift()) awayReport(); else setTimeout(awayReport, 400); roomTip(); }
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
