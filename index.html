  :root{--gold:#ffd34d;--cream:#fdf6e8;--ink:#2b2238;--panel:rgba(30,14,58,.92);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#1a0b33;color:var(--cream);font-family:"BIPs","Baloo 2","Segoe UI Rounded","Trebuchet MS",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;}
  #stage{position:relative;flex:1;width:100%;max-width:520px;}
  canvas#room{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none;z-index:3;}
  .pill{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;background:rgba(24,10,48,.62);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12),0 6px 18px rgba(0,0,0,.25);font-size:16px;}
  .lvl{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#ffe38a,#ff9f45);color:#3a1a00;font-size:15px;box-shadow:0 3px 0 #b8660e;}
  .coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c0,#ffd34d 45%,#e09a10);box-shadow:inset 0 0 0 2px #b8780e;}
  .needs{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;justify-content:center;gap:6px;z-index:3;pointer-events:none;}
  .need{pointer-events:auto;cursor:pointer;width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;opacity:.95;}
  .need canvas{width:46px;height:46px;}
  .bar{width:100%;max-width:520px;display:flex;justify-content:space-around;gap:6px;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(180deg,rgba(26,11,51,0),rgba(26,11,51,.95) 30%);position:relative;z-index:4;}

function applyTime(now){
  let h = (now - pet.t) / 3600000;
  if (!(h > 0)) { pet.t = now; return 0; }
  h = Math.min(h, 96);
  const away = h > 0.25;
  let left = h, done = 0;
  while (left > 0){
    const st = Math.min(0.25, left);
    const k = away && done >= 2 ? 0.5 : 1;
    const r = pet.sleep ? RATES.sleep : RATES.awake;
    for (const n in r){
      const floor = away && r[n] > 0 ? 12 : 0;
      const v = pet[n] - r[n] * st * (r[n] > 0 ? k : 1);
      pet[n] = clamp(r[n] > 0 && pet[n] >= floor ? Math.max(floor, v) : v, 0, 100);
    }
    if (away && !pet.sleep && pet.energy <= 15){ pet.sleep = true; napped = true; }
    if (away && pet.sleep && pet.energy >= 100){ pet.sleep = false; }
    left -= st; done += st;
  }
  pet.t = now;
  return h;
}

function audio(){

    const comp = actx.createDynamicsCompressor(); comp.connect(actx.destination);
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000; lp.connect(comp);

    conv.buffer = buf;

  } catch (e) {}
}

function skyColors(){

  if (h >= 17 && h < 20) return { a: '#ff9a7a', b: '#ffd8a0', sun: 0.6, night: 0.2, beam: 'rgba(255,190,130,' };
  if (h >= 5 && h < 7) return { a: '#9aa8ff', b: '#ffc8b0', sun: 0.4, night: 0.3, beam: 'rgba(255,210,190,' };
  return { a: '#1a1a4a', b: '#3a2a7a', sun: 0, night: 1, beam: 'rgba(170,190,255,' };
}

function wakeUp(auto){
  if (!pet.sleep) return;
  const from = spotOf('bed');
  pet.sleep = false;
  sfx.wake();
  cab.x = pet.at === 'bed' ? 170 : 200; cab.tx = cab.x;
  if (pet.at === 'bed') jumpTo({ x: cab.x, y: baseY(), s: CS }, 70, 0.6, null, from);
  if (!auto && pet.energy < 50){ pet.fun = clamp(pet.fun - 5, 0, 100); toast(pet.name + ' ещё сонный...'); }
  else toast(auto ? pet.name + ' выспался!' : 'Доброе утро!');
  updateRoomUi(); save(); refreshHud();
}
function busyCheck(){
  if (pet.sleep){ toast(pet.name + ' спит. Разбудить можно в спальне'); return true; }
  return busyAnim();
}
function accident(){
  pet.toilet = 55;
  pet.clean = clamp(pet.clean - 20, 0, 100); pet.fun = clamp(pet.fun - 8, 0, 100);
  const sp = cabSpot();
  resetModes();
  if (pet.at !== 'toilet') pet.puddle = { room: pet.at, x: clamp(sp.x + 20, 70, 330) };
  cab.shake = 1; sfx.no();
  toast('Ой! ' + pet.name + ' не добежал до туалета');
  save(); refreshHud();
}
function finishPotty(){
  pottyT = 0;
  pet.toilet = 100; pet.tray = Math.min(3, pet.tray + 1); pet.stats.potty = (pet.stats.potty || 0) + 1;
  sfx.done(); addXp(3);
  const from = cabSpot();
  cab.onTray = false; cab.x = 150; cab.tx = 150;
  jumpTo({ x: 150, y: baseY(), s: CS }, 60, 0.5, () => { cab.joy = 1.3; burst(150, baseY() - 60, 14, ['#ffffff', '#fff3b0', '#9fe6ff']); }, from);
  mode = 'idle';
  toast(pet.tray >= 2 ? 'Готово! Лоток грязный, убери его' : 'Готово! Молодец');
  updateRoomUi(); refreshHud(); save();
}
function finishScoop(){
  scoopT = 0;
  pet.tray = 0;
  sfx.clean(); addXp(2);
  const got = earnCoins(2);
  burst(262, floorY + 90, 16, ['#ffffff', '#fff3b0', '#9fe0a8']);
  toast(got ? 'Лоток чистый! +' + got + ' монеты' : 'Лоток чистый!');
  updateRoomUi(); save();
}
function openSheet(id){ document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('open', s.id === id)); sfx.sheet(); }
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open')); }
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));

function renderFoods(){
  const box = document.getElementById('foods');
  box.innerHTML = '';
  box.style.flexWrap = 'wrap';
  for (const f of FOODS){
    const locked = f.lv && pet.lvl < f.lv;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'food' + (locked || pet.coins < f.p ? ' cant' : '');
    b.style.minWidth = '28%';
    const c = document.createElement('canvas'); c.width = 120; c.height = 120;
    const q = c.getContext('2d'); q.scale(2, 2); drawFood(q, f.id, 30, 32, 1.2);
    const n = document.createElement('span'); n.textContent = f.n;
    const pr = document.createElement('small'); pr.textContent = locked ? 'с ' + f.lv + ' уровня' : (f.p ? f.p + ' монет' : 'бесплатно');
    b.appendChild(c); b.appendChild(n); b.appendChild(pr);
    b.addEventListener('click', () => {
      if (locked){ toast('Откроется на ' + f.lv + ' уровне'); return; }
      if (pet.hunger >= 96){ closeSheets(); cab.shake = 1; sfx.no(); toast(pet.name + ' уже сыт'); return; }
      if (!spendCoins(f.p)){ toast('Не хватает монет'); return; }
      closeSheets();
      flyFood = { id: f.id, k: 0 };
    });
    box.appendChild(b);
  }
}
document.getElementById('aFeed').addEventListener('click', () => {
  audio();
  if (busyCheck()) return;
  stopModes();
  renderFoods();
  openSheet('foodSheet');
});
document.getElementById('aPlay').addEventListener('click', () => {
  audio();
  if (busyCheck()) return;
  if (mode === 'play'){ endPlay(); return; }
  if (pet.energy < 10){ cab.shake = 1; sfx.no(); toast(pet.name + ' устал. Уложи его спать'); return; }
  stopModes();
  mode = 'play'; setActOn('aPlay', true);
  combo = 0;
  ball = { x: clamp(cab.x + 90, 60, 340), y: baseY() - 40, gy: baseY() - 8, vx: 0, vy: 0, rot: 0, flying: false, hint: 1, sq: 0 };
  toast('Подкидывай мяч, кэббит будет ловить');
});
document.getElementById('aWash').addEventListener('click', () => {
  audio();
  if (busyCheck()) return;
  if (mode === 'wash'){ exitTub(); return; }
  if (pet.clean >= 97){ toast(pet.name + ' и так чистый'); return; }
  mode = 'wash'; setActOn('aWash', true);
  jumpTo(spotOf('tub'), 95, 0.62, () => {
    cab.inTub = true; sfx.splash();
    for (let i = 0; i < 14; i++) addPart({ k: 'drop', x: 200 + rand(-60, 60), y: floorY + 40, vx: rand(-120, 120), vy: rand(-260, -120), life: 1, d: 1.4, fl: floorY + 60 });
    toast('Три кэббита пальцем, как губкой');
  });
});
document.getElementById('aPotty').addEventListener('click', () => {
  audio();
  if (busyCheck()) return;
  if (pet.tray >= 2){ cab.shake = 1; sfx.no(); toast('В грязный лоток ' + pet.name + ' не пойдёт. Сначала убери'); document.getElementById('aScoop').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 400, iterations: 2 }); return; }
  if (pet.toilet >= 85){ toast(pet.name + ' пока не хочет в туалет'); return; }
  stopModes();
  mode = 'potty';
  jumpTo(spotOf('tray'), 60, 0.5, () => { cab.onTray = true; pottyT = 2.2; toast('Не подглядывай!'); });
});
document.getElementById('aScoop').addEventListener('click', () => {
  audio();
  if (busyCheck() || mode === 'potty') return;
  if (pet.tray <= 0){ toast('Лоток и так чистый'); return; }
  scoopT = SCOOP_DUR;
});
document.getElementById('aSleep').addEventListener('click', () => {
  audio();
  if (pet.sleep){ if (!cab.jump) wakeUp(false); return; }
  if (busyAnim()) return;
  if (pet.energy >= 95){ toast(pet.name + ' совсем не хочет спать'); return; }
  stopModes();
  jumpTo(spotOf('bed'), 80, 0.7, () => {
    pet.sleep = true; pet.stats.slept++;
    sfx.sleep(); toast('Спокойной ночи, ' + pet.name + '!');
    addXp(2); updateRoomUi(); save(); refreshHud();
  });
});

function wearPreview(slot, it){

let wardTab = 'hat';
function renderWardrobe(){
  document.getElementById('shopTitle').textContent = 'Гардероб';
  const tabs = document.getElementById('shopTabs');
  tabs.innerHTML = '';
  for (const [k, n] of WEAR_TABS){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tab' + (k === wardTab ? ' on' : ''); b.textContent = n;
    b.addEventListener('click', () => { wardTab = k; sfx.tap(); renderWardrobe(); });
    tabs.appendChild(b);
  }
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  for (const it of WEAR[wardTab]){
    const key = 'wear_' + wardTab + ':' + it.id;
    const own = pet.owned.indexOf(key) !== -1 || it.p === 0;
    const locked = !own && it.lv && pet.lvl < it.lv;
    const cur = pet.wear[wardTab] === it.id;
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'item' + (cur ? ' cur' : '') + (!own && (locked || pet.coins < it.p) ? ' cant' : '');
    b.appendChild(wearPreview(wardTab, it));
    const n = document.createElement('span'); n.textContent = it.n; b.appendChild(n);
    const pr = document.createElement('span'); pr.className = 'pr';
    if (cur) pr.textContent = it.id === 'none' ? 'Выбрано' : 'Надето';
    else if (own) pr.textContent = it.id === 'none' ? 'Снять' : 'Надеть';

function mgResize(){

  }

const MGAMES = {
  carrot: {
    init(G){ G.px = 200; G.face = 1; G.lives = 3; G.items = []; G.spawn = 0.4; G.joy = 0; G.hurt = 0; },

  jump: {

    },
    mk(y, h){

function unlocksAt(lv){
  const out = [];

  for (const slot in WEAR) for (const it of WEAR[slot]) if (it.lv === lv) out.push({ n: it.n, c: () => wearPreview(slot, it) });
  for (const f of FOODS) if (f.lv === lv) out.push({ n: f.n, c: () => { const c = document.createElement('canvas'); c.width = 168; c.height = 128; const q = c.getContext('2d'); q.scale(2, 2); const bg = q.createLinearGradient(0, 0, 0, 64); bg.addColorStop(0, '#3a2466'); bg.addColorStop(1, '#241444'); q.fillStyle = bg; q.fillRect(0, 0, 84, 64); drawFood(q, f.id, 42, 32, 1.1); return c; } });
  for (const m of MINIGAMES) if (m.lv === lv) out.push({ n: 'Игра «' + m.n + '»', c: () => { const c = document.createElement('canvas'); c.width = 168; c.height = 128; const q = c.getContext('2d'); q.scale(2, 2); q.fillStyle = '#2a1650'; q.fillRect(0, 0, 84, 64); q.translate(42, 32); q.scale(0.95, 0.95); drawMgIcon(q, m.id); return c; } });
  return out;
}

function itemPreview(cat, it){

  q.save();

  else if (cat === 'floor'){ floorY = 0; W = 84; H = 64; drawFloor(q, it); }
  else if (cat === 'tiles'){ drawTiles(q, it, 0, 0, 84, 64); }
  else if (cat === 'sofa'){ q.translate(42, 58); q.scale(0.4, 0.4); drawSofa(q, it.id, 0, 0); }
  else if (cat === 'night'){ q.translate(42, 62); q.scale(0.5, 0.5); drawNight(q, it.id, 0, 0, 0.8); }
  else if (cat === 'tub'){ q.translate(42, 24); q.scale(0.29, 0.29); drawTub(q, it.id, 0, 0, 'back', 0.8); drawTub(q, it.id, 0, 0, 'front', 0.8); }
  else if (cat === 'toy'){ if (it.id !== 'none'){ q.translate(42, 38); q.scale(1.3, 1.3); drawToy(q, it.id, 0, 0, 0); } }
  else if (cat === 'potty'){ q.translate(42, 44); q.scale(0.3, 0.3); drawPotty(q, it.id, 0, 0, 'back', 0); drawPotty(q, it.id, 0, 0, 'front', 0); }
  else if (it.id !== 'none'){
    const sc = { rug: 0.33, bed: 0.46, lamp: 0.34, plant: 0.62, poster: 0.44, window: 0.36 }[cat];
    q.translate(42, 34); q.scale(sc, sc);
    const off = { rug: [-180, -(keep.floorY + 160)], bed: [-300, -(keep.floorY + 36)], lamp: [-118, -(keep.floorY - 56)], plant: [-42, -(keep.floorY + 30)], poster: [-308, -(keep.floorY - 204)], window: [-94, -(keep.floorY - 194)] }[cat];
    q.translate(off[0], off[1]);
    if (cat === 'rug') drawRug(q, it.id);
    if (cat === 'bed') drawBed(q, it.id);
    if (cat === 'lamp') drawLamp(q, it.id, 0, 0.7);
    if (cat === 'plant') drawPlant(q, it.id, 0);
    if (cat === 'poster') drawPoster(q, it.id);

}
function renderShop(){
  const defs = ROOM_TABS[pet.at];
  if (!defs.find(x => x[0] === shopTab)) shopTab = defs[0][0];
  document.getElementById('shopTitle').textContent = ROOMS.find(r => r.id === pet.at).n;
  const tabs = document.getElementById('shopTabs');
  tabs.innerHTML = '';
  for (const [k, n] of defs){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tab' + (k === shopTab ? ' on' : ''); b.textContent = n;
    b.addEventListener('click', () => { shopTab = k; sfx.tap(); renderShop(); });
    tabs.appendChild(b);
  }
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  const cat = catOf(shopTab);
  for (const it of ROOM[cat]){
    const key = cat + ':' + it.id;
    const own = pet.owned.indexOf(key) !== -1 || it.p === 0;
    const locked = !own && it.lv && pet.lvl < it.lv;
    const cur = pet.room[shopTab] === it.id;
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'item' + (cur ? ' cur' : '') + (!own && (locked || pet.coins < it.p) ? ' cant' : '');
    b.appendChild(itemPreview(cat, it));
    const n = document.createElement('span'); n.textContent = it.n; b.appendChild(n);
    const pr = document.createElement('span'); pr.className = 'pr';
    if (cur) pr.textContent = 'Стоит';
    else if (own) pr.textContent = 'Поставить';
    else if (locked){ pr.className = 'lock'; pr.textContent = 'с ' + it.lv + ' уровня'; }
    else { const cc = document.createElement('i'); cc.className = 'coin'; pr.appendChild(cc); pr.appendChild(document.createTextNode(String(it.p))); }
    b.appendChild(pr);
    b.addEventListener('click', () => {
      if (locked){ toast('Откроется на ' + it.lv + ' уровне'); return; }
      if (!own){
        if (!spendCoins(it.p)){ toast('Не хватает монет'); return; }
        pet.owned.push(key); sfx.buy(); toast('Куплено: ' + it.n); addXp(4);
        burst(200, floorY, 14, ['#ffd34d', '#fff3b0']);
      } else sfx.tap();
      pet.room[shopTab] = it.id;
      bgCache = null; save(); renderShop();
    });
    grid.appendChild(b);
  }
}

function paintModalArt(art){
  modalArtKind = art;
  const c = document.getElementById('modalArt');
  const q = c.getContext('2d');
  q.setTransform(1, 0, 0, 1, 0, 0); q.clearRect(0, 0, 240, 200);
  const gl = q.createRadialGradient(120, 110, 10, 120, 110, 110); gl.addColorStop(0, 'rgba(255,211,77,.35)'); gl.addColorStop(1, 'rgba(255,211,77,0)');
  q.fillStyle = gl; q.fillRect(0, 0, 240, 200);
  if (art === 'gift'){ q.translate(120, 100); q.scale(3, 3); drawIcon(q, 'gift'); }
  else { q.translate(120, 190); q.scale(0.95, 0.95); if (heroReady){ q.drawImage(heroVariant(0), -BOX / 2, -BOX, BOX, BOX); } else drawVectorCabbit(q, { sleep: false, joy: art === 'lvl' ? 1 : 0, mood: 90, look: 0, chew: 0, dirt: 0, t: 0, blink: 0 }); }
}
document.getElementById('mBtn').addEventListener('click', () => {
  audio();
  const inp = document.getElementById('mInput');
  if (!inp.hidden){
    const v = inp.value.replace(/[<>"'`]/g, '').trim().slice(0, 14);
    if (!v){ inp.placeholder = 'Придумай имя'; return; }
    pet.name = v; save(); refreshHud();
  }
  document.getElementById('modal').hidden = true;
  const cb = modalCb; modalCb = null;
  sfx.tap();
  if (cb) cb();
});

function dailyGift(){
  const d = todayKey();
  if (pet.daily.d === d) return false;
  const y = new Date(Date.now() - 86400000);
  const yk = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate();
  const streak = pet.daily.d === yk ? Math.min(7, pet.daily.streak + 1) : 1;
  pet.daily = { d, streak };
  const gift = 20 + streak * 10;
  pet.coins += gift; save(); refreshHud();
  showModal('Подарок дня', 'День ' + streak + ' подряд: ' + gift + ' монет. Заходи каждый день, подарок растёт до 7 дня!', 'Забрать', () => { sfx.coin(); bumpCoins(); }, 'gift');
  return true;
}
function awayReport(){
  if (awayHours < 1) return false;
  const worst = NEEDS.map(n => n[0]).sort((a, b) => pet[a] - pet[b])[0];
  const words = { hunger: 'проголодался', clean: 'испачкался', fun: 'заскучал', energy: 'устал', toilet: 'очень хочет в туалет' };
  const h = Math.round(awayHours);
  const text = pet[worst] < 50 ? 'Тебя не было ' + h + ' ч. ' + pet.name + ' ' + words[worst] + ' и ждёт тебя.' : 'Тебя не было ' + h + ' ч. ' + pet.name + ' скучал, но держится молодцом!';
  toast(napped && pet.sleep ? 'Тебя не было ' + h + ' ч. ' + pet.name + ' устал и сам уснул. Не буди, пусть поспит.' : text);
  return true;
}
window.addEventListener('resize', resize);
try { new ResizeObserver(() => resize()).observe(cvs); } catch (e) {}
document.addEventListener('visibilitychange', () => { if (!document.hidden){ applyTime(Date.now()); refreshHud(); } else save(); });
window.addEventListener('pagehide', save);
resize();
refreshHud();
updateRoomUi();
if (firstRun){
  showModal('Привет!', 'Это твой кэббит. У него четыре комнаты, листай их стрелками: гостиная для еды и игр, ванная, туалет и спальня. Как его назовёшь?', 'Готово', () => {
    toast('Держи 150 монет на обустройство комнаты');
    pet.daily = { d: todayKey(), streak: 1 }; save();
  }, 'hello', true);
} else if (!dailyGift()) awayReport();
else setTimeout(awayReport, 400);
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
